<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0C0B" />
    <meta name="color-scheme" content="dark light" />

    <!-- Apply saved theme before first paint (no flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('barha-theme')
          if (!t) t = 'dusk'
          document.documentElement.setAttribute('data-theme', t)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'aube' ? '#F4EEE2' : '#0E0C0B')
        } catch (e) {}
      })()
    </script>

    <title>Barira Handicrafts — Manufacturer &amp; Exporter of Premium Metalware</title>
    <meta
      name="description"
      content="Barira Handicrafts — a heritage manufacturer and exporter of premium metal decor from Moradabad, India. Hand-hammered brass, cast iron, and copper, forged for the world."
    />
    <meta property="og:title" content="Barira Handicrafts — Manufacturer & Exporter" />
    <meta property="og:description" content="Heritage metal handicrafts, cast and hammered in the Brass City of Moradabad." />
    <meta property="og:type" content="website" />

    <!-- Fonts: Athelas alternative (Cormorant Garamond / Playfair) + Moara alternative (Bebas Neue / Oswald) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:4rem;font-family:Georgia,serif;color:#EFE9DD;background:#0E0C0B;min-height:100vh">
        Barira Handicrafts is an interactive experience. Please enable JavaScript to view the catalogue.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
